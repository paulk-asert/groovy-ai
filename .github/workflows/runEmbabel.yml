name: "Run Embabel examples"

on:
  workflow_dispatch:
  push:
    paths:
      - 'build.gradle'
      - 'embabel/build.gradle'
      - 'common/src/main/**'
      - 'embabel/src/main/**'
      - '.github/workflows/runEmbabel.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    env:
      OLLAMA_HOME: /home/runner/.ollama

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
          check-latest: true

      - name: Prepare Ollama directories
        run: |
          mkdir -p "$OLLAMA_HOME/models/blobs"
          mkdir -p "$OLLAMA_HOME/models/manifests"
          echo "OLLAMA_HOME=$OLLAMA_HOME" >> "$GITHUB_ENV"

      - uses: ai-action/setup-ollama@v1

      # One entry for blobs and manifests: sharding by sha prefix left two of the four
      # buckets empty. The key names the models, so adding one invalidates deliberately,
      # while restore-keys still reuses the previous cache so only the new model is pulled.
      - name: Cache Ollama models
        uses: actions/cache@v5
        with:
          path: ${{ env.OLLAMA_HOME }}/models
          key: ollama-models-${{ runner.os }}-mistral7b-qwen3_8b
          restore-keys: |
            ollama-models-${{ runner.os }}-

      - name: Download models if needed
        run: |
          for model in mistral:7b qwen3:8b; do
            ollama list | grep "$model" || ollama pull "$model"
          done

      - uses: gradle/actions/setup-gradle@v6
      - name: Run Embabel examples
        run: ./gradlew run.embabel.All
        timeout-minutes: 60
