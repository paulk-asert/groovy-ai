name: "Run decision model example"

# The decision example is excluded from run.langchain4j.All and runs here instead,
# triggered only by changes to itself: tev1 is a 4.4GB pull, and it is deliberately
# not cached, since the Actions cache is shared across the whole repository.
on:
  workflow_dispatch:
  push:
    paths:
      - 'langchain4j/src/main/groovy/langchain4j/HolidayDecision.groovy'
      - 'langchain4j/build.gradle'
      - '.github/workflows/runDecision.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
          check-latest: true
      - uses: ai-action/setup-ollama@v1
      - name: Load decision model
        run: ollama pull tev1
      - uses: gradle/actions/setup-gradle@v5
      - name: Run decision example
        run: ./gradlew run.langchain4j.HolidayDecision
        timeout-minutes: 60
