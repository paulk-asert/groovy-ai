name: "Run OpenAI-compatible examples (llmao, OpenRouter)"

on:
  workflow_dispatch:
  push:
    paths:
      - 'build.gradle'
      - 'openai-compatible/build.gradle'
      - 'common/src/main/**'
      - 'openai-compatible/src/main/**'
      - '.github/workflows/runOpenAICompatible.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LLMAO_API_KEY: ${{ secrets.LLMAO_API_KEY }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
          check-latest: true

      - uses: gradle/actions/setup-gradle@v5
      # without either secret (e.g. on forks) the scripts would fall back to Ollama, which isn't installed here;
      # if both are set, llmao is used
      - name: Run OpenAI-compatible examples
        if: env.LLMAO_API_KEY != '' || env.OPENROUTER_API_KEY != ''
        run: ./gradlew run.openai-compatible.All
        timeout-minutes: 30
