name: "Run OpenAI-compatible examples (llmao, OpenRouter)"

on:
  workflow_dispatch:
  push:
    paths:
      - 'build.gradle'
      - 'openai-compatible/build.gradle'
      - 'common/src/main/**'
      - 'openai-compatible/src/main/**'
      - '.github/workflows/runOpenAICompatible.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LLMAO_API_KEY: ${{ secrets.LLMAO_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 25
          check-latest: true

      # Ollama is the fallback when neither secret is set (e.g. on forks), and HolidayParallel
      # always queries it alongside any hosted provider, so it is needed either way
      - uses: ai-action/setup-ollama@v1
      - name: Load model
        run: ollama pull mistral:7b

      - uses: gradle/actions/setup-gradle@v5
      # if both secrets are set, llmao is the provider the single-provider examples use
      - name: Run OpenAI-compatible examples
        run: ./gradlew run.openai-compatible.All
        timeout-minutes: 30
