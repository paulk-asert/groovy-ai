name: "Run Micronaut AI native examples"

on:
  workflow_dispatch:
  push:
    paths:
      - 'build.gradle'
      - 'gradle.properties'
      - 'micronaut/build.gradle'
      - 'common/src/main/**'
      - 'micronaut/src/main/**'
      - '.github/workflows/runMicronautNative.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          # 25.2 or later needed: earlier versions unconditionally substitute
          # vmplugin.v7.IndyInterface.invalidateSwitchPoints, a method current
          # Groovy versions no longer have, and the image build fails
          version: '25.2'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-models-${{ runner.os }}-${{ hashFiles('.github/workflows/runMicronautNative.yml') }}
          restore-keys: |
            ollama-models-${{ runner.os }}-

      - uses: ai-action/setup-ollama@v1
      - name: Load models (if not cached)
        run: |
          ollama list | grep "qwen3:8b" || ollama pull qwen3:8b

      - uses: gradle/actions/setup-gradle@v5
      - name: Build native executables
        run: ./gradlew :micronaut:nativeHolidayCompile :micronaut:nativeStructuredCompile :micronaut:nativeToolsCompile
        timeout-minutes: 30
      - name: Run native Holiday example
        run: micronaut/build/native/nativeHolidayCompile/holiday
        timeout-minutes: 20
      - name: Run native Structured example
        run: micronaut/build/native/nativeStructuredCompile/structured
        timeout-minutes: 20
      - name: Run native Tools example
        run: micronaut/build/native/nativeToolsCompile/tools
        timeout-minutes: 30
