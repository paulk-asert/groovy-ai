plugins {
    id 'groovy-setup'
    id 'io.quarkus' version '3.39.4'
}

var quarkusVersion = '3.39.4'

dependencies {
    implementation project(':common')
    implementation platform("io.quarkus:quarkus-bom:$quarkusVersion")
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkiverse.langchain4j:quarkus-langchain4j-ollama:1.13.3'
    implementation "io.quarkus:quarkus-test-common:$quarkusVersion"
}

quarkus {
    finalName = 'groovy-ai-quarkus'
}

// the Quarkus example is launched by quarkusRun rather than a JavaExec run task
tasks.named("run.${project.name}.All") {
    dependsOn 'quarkusRun'
}
