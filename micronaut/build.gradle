plugins {
    id 'groovy-setup'
    id 'io.micronaut.application' version '5.0.2'
    id 'org.graalvm.buildtools.native' version '1.1.13' apply false
}

dependencies {
    implementation project(':common')
    compileOnly 'io.micronaut:micronaut-inject-groovy'
    implementation 'io.micronaut:micronaut-runtime'
    implementation "org.apache.groovy:groovy-datetime:$groovyVersion"
    implementation "org.apache.groovy:groovy-json:$groovyVersion"
    runtimeOnly "org.slf4j:slf4j-simple:$slf4jVersion"
    implementation platform('io.micronaut.langchain4j:micronaut-langchain4j-bom:2.2.0')
    implementation 'io.micronaut.langchain4j:micronaut-langchain4j-core'
    implementation 'io.micronaut.langchain4j:micronaut-langchain4j-ollama'
    runtimeOnly 'dev.langchain4j:langchain4j-http-client-jdk'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
}

micronaut {
    version '5.1.5'
    runtime 'none'  // no embedded server
}

var nativeScripts = ['Holiday', 'Structured', 'Tools']
var nativeRunTasks = nativeScripts.collect { 'run.micronaut.' + it }

graalvmNative {
    toolchainDetection = false
    agent {
        // record reflection metadata when running the scripts with -Pagent
        tasksToInstrumentPredicate = { t -> t.name in nativeRunTasks }
        metadataCopy {
            inputTaskNames.addAll(nativeRunTasks)
            outputDirectories.add('src/main/resources/META-INF/native-image/groovy-ai/micronaut')
            mergeWithExisting = true
        }
    }
    binaries {
        nativeScripts.each { script ->
            create(script.toLowerCase()) {
                imageName = script.toLowerCase()
                mainClass = "micronaut.$script"
                classpath(tasks.named('jar'), configurations.named('nativeImageClasspath'))
            }
        }
    }
}
